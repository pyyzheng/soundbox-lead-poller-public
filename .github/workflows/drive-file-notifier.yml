name: Drive File Notifier

# 长跑 job 内 30s 轮询；代码更新后应立刻用新 job 替换旧 job，而不是排队等 2 小时。
on:
  push:
    branches: [main]
    paths:
      - "drive-file-notifier/**"
      - ".github/workflows/drive-file-notifier.yml"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "本轮轮询时长（分钟）"
        required: false
        default: "60"
      chain:
        description: "正常结束后是否接力下一轮"
        required: false
        default: "true"
  # 看门狗：链条断了时每半小时尝试拉起来一次
  schedule:
    - cron: "7,37 * * * *"

# 新 run 启动时取消还在跑的旧 run，避免一直卡在旧代码上
concurrency:
  group: drive-file-notifier
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notify:
    name: Watch Drive & Notify Chat
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: drive-file-notifier

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: drive-file-notifier/package-lock.json

      - name: Install system deps (PDF/image compress)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript zip

      - name: Install npm deps
        run: npm ci

      - name: Restore poll state
        uses: actions/cache@v4
        id: state-cache
        with:
          path: drive-file-notifier/.drive-notifier-state.json
          # 固定 key：避免 job 被取消时 per-run 缓存写不回，下一轮又把同一文件当新上传
          key: drive-notifier-state
          restore-keys: |
            drive-notifier-state

      - name: Watch Drive
        id: watch
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_ID: ${{ secrets.DRIVE_NOTIFIER_CHAT_ID }}
          STATE_PATH: ${{ github.workspace }}/drive-file-notifier/.drive-notifier-state.json
          POLL_INTERVAL_MS: "30000"
          DURATION_MINUTES: ${{ inputs.duration_minutes || '60' }}
        run: MAX_RUN_MS=$(( DURATION_MINUTES * 60 * 1000 )) npm run loop

      - name: Save poll state
        if: always() && steps.watch.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: drive-file-notifier/.drive-notifier-state.json
          key: drive-notifier-state

      - name: Chain next watcher
        # 只有正常跑完才接力；被取消/被新 push 顶掉时不再排队旧代码
        if: success() && (inputs.chain != 'false')
        env:
          GH_TOKEN: ${{ secrets.GHA_PAT }}
        run: gh workflow run drive-file-notifier.yml --ref ${{ github.ref_name }}
