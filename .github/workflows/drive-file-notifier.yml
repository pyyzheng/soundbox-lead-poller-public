name: Drive File Notifier

# GitHub 的 schedule 在本仓库既不准时也常被丢弃，5 分钟又是它的下限。
# 改为一个长跑 job 内部短间隔轮询，结束前接力启动下一个 job。
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "本轮轮询时长（分钟）"
        required: false
        default: "120"
      chain:
        description: "结束后是否接力下一轮"
        required: false
        default: "true"
  # 看门狗：接力断掉时把链条重新拉起来（concurrency 保证不会重复跑）
  schedule:
    - cron: "7,37 * * * *"
  workflow_run:
    workflows: ["Assignment Unblock", "Lead Notify Backup", "Messenger Dedup"]
    types: [completed]

# 同一时间只允许一个轮询 job；后来的排队，等前一个连同缓存写回一起结束
concurrency:
  group: drive-file-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: Watch Drive & Notify Chat
    runs-on: ubuntu-latest
    timeout-minutes: 140
    defaults:
      run:
        working-directory: drive-file-notifier

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: drive-file-notifier/package-lock.json

      - name: Install system deps (PDF/image compress)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript zip

      - name: Install npm deps
        run: npm ci

      - name: Restore poll state
        uses: actions/cache@v4
        with:
          path: drive-file-notifier/.drive-notifier-state.json
          # 每次 run_id 不同 → 结束时写入新缓存；restore-keys 取最近一次
          key: drive-notifier-state-${{ github.run_id }}
          restore-keys: |
            drive-notifier-state-

      - name: Watch Drive
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_ID: ${{ secrets.DRIVE_NOTIFIER_CHAT_ID }}
          STATE_PATH: ${{ github.workspace }}/drive-file-notifier/.drive-notifier-state.json
          POLL_INTERVAL_MS: "30000"
          DURATION_MINUTES: ${{ inputs.duration_minutes || '120' }}
        run: MAX_RUN_MS=$(( DURATION_MINUTES * 60 * 1000 )) npm run loop

      - name: Chain next watcher
        # 即使轮询异常退出也要接力，否则链条就断了
        if: always() && (inputs.chain != 'false')
        env:
          GH_TOKEN: ${{ secrets.GHA_PAT }}
        run: gh workflow run drive-file-notifier.yml --ref ${{ github.ref_name }}
