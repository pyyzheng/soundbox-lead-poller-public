name: Sync Follow-up To Opportunity

# 询盘 Follow-up Records → 商机侧客户推进记录（每2分钟兜底 + 手工/单条）
on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
    inputs:
      record_id:
        description: "源 Follow-up record_id（可选，指定则只同步一条）"
        required: false
        type: string
  repository_dispatch:
    types: [followup-opp-sync]

permissions:
  contents: read

jobs:
  sync:
    name: Sync followups to opportunity follow-up table
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Sync
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_FOLLOWUP_TABLE: tbl3n8TTJYXHG12q
          FEISHU_SALES_NOTIFY_TABLE: ${{ secrets.FEISHU_SALES_NOTIFY_TABLE }}
          OPP_BASE_TOKEN: Ktddb4mhtaixgYs9CIkcNnXFngh
          OPP_TABLE_ID: tblz7klQPWxg9H15
          OPP_FOLLOWUP_TABLE: tbl5cYBxiF57LhbX
          RECORD_ID: ${{ github.event.inputs.record_id || github.event.client_payload.record_id || '' }}
        run: |
          set -euo pipefail
          if [ -n "${RECORD_ID}" ]; then
            python3 scripts/sync_followup_to_opportunity.py --record-id "${RECORD_ID}"
          else
            python3 scripts/sync_followup_to_opportunity.py --incremental
          fi
