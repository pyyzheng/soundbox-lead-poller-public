name: Sync Offline Enquiry To Opportunity Base

# 线下询盘/跟进 → 商机 Base 镜像表（每2分钟准实时）
on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync offline enquiry/follow-up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Sync
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          OPP_BASE_TOKEN: Ktddb4mhtaixgYs9CIkcNnXFngh
          OFFLINE_SRC_ENQ_TABLE: tblzrNcFHAISzi5a
          OFFLINE_SRC_FU_TABLE: tblgqC1lbgFazdUB
          OFFLINE_DST_ENQ_TABLE: tblV75ehPDgd7CHV
          OFFLINE_DST_FU_TABLE: tblj2h1ffFxlh78i
        run: python3 scripts/sync_offline_enquiry_to_opp_base.py
